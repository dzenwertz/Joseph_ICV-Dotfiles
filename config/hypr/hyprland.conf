# #######################################################################################
# HYPRLAND CONFIGURATION - MINIMALIST & LOW CONSUMPTION
# Inspired by LierB dotfiles & optimized for Arch Linux
# #######################################################################################

# --- MONITORS ---
# Laptop eDP-1 screen: 1080p @ 144Hz
monitor = eDP-1, 1920x1080@144, 0x0, 1
monitor = , preferred, auto, 1

# --- MY PROGRAMS ---
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun
$wallpaperScript = ~/.config/hypr/scripts/wallpaper.sh
$screenshotScript = ~/.config/hypr/scripts/screenshot.sh

# --- AUTOSTART ---
exec-once = ~/.config/hypr/scripts/wallpaper.sh
exec-once = waybar
exec-once = mako
exec-once = easyeffects --service-mode

# --- ENVIRONMENT VARIABLES ---
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Toolkit & Wayland Integration
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Battery optimization: Intel primary GPU with Nvidia offload capability
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1

# --- INPUT ---
input {
    # Soporte para teclado Latinoamericano, Español y US (Alternar con Alt+Shift)
    kb_layout = latam,es,us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.8
    }
}

# --- LOOK AND FEEL (MINIMALISTA Y BAJO CONSUMO) ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(6c7086ee) rgba(36394aee) 45deg
    col.inactive_border = rgba(181822aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 0.98
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00000088)
    }

    # Desactivar blur pesado ahorra bateria y calor en laptop
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 4, easeOutQuint
    animation = windowsOut, 1, 3, smoothIn, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, easeOutQuint, slide
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# --- KEYBINDINGS ---
$mainMod = SUPER

# Aplicaciones principales
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit

# Barra y Fondo
bind = $mainMod, B, exec, ~/.config/waybar/launch.sh
bind = $mainMod, W, exec, $wallpaperScript

# Salida y bloqueo
bind = $mainMod, M, exit

# Capturas de pantalla (Estilo Windows: Impr Pant o Win+Shift+S seleccionan área y copian al portapapeles)
bind = , Print, exec, $screenshotScript area
bind = $mainMod SHIFT, S, exec, $screenshotScript area
bind = $mainMod, Print, exec, $screenshotScript full

# Navegación entre ventanas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u

# Mover ventanas
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Espacios de trabajo (Workspaces)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Mover ventana a espacio de trabajo
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Scroll a través de workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mover y redimensionar con mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Teclas multimedia y de brillo (Laptop)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- REGLAS DE VENTANAS (Window Rules) ---
windowrule = match:class pavucontrol, float 1
windowrule = match:class blueman-manager, float 1
windowrule = match:class nm-connection-editor, float 1
windowrule = match:title ^(Abrir archivo)$, float 1
windowrule = match:title ^(Guardar archivo)$, float 1
windowrule = match:title ^(Confirmación de archivo)$, float 1
